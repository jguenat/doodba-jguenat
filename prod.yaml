version: "2.4"

services:
  odoo:
    extends:
      file: common.yaml
      service: odoo
    restart: unless-stopped
    env_file:
      - .docker/odoo.env
      - .docker/db-access.env
    environment:
      DB_FILTER: "^prod"
      DOODBA_ENVIRONMENT: "${DOODBA_ENVIRONMENT-prod}"
      INITIAL_LANG: "fr_CH"
      ODOO_BUS_PUBLIC_SAMESITE_WS: 1
      PGHOST: jguenat-18-0-prod-db
    depends_on:
      - db
    volumes:
      - /data/database/odoo:/backup
    networks:
      default:
    # still on 15 port because lazzy
    ports:
      - "15069:8069"
      - "15072:8072"
    labels:
      doodba.domain.main: ""

  db:
    extends:
      file: common.yaml
      service: db
    environment:
      DB_HOST: jguenat-18-0-prod-db
    env_file:
      - .docker/db-creation.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - "jguenat-18-0-prod-db"

networks:
  default:
    driver_opts:
      encrypted: 1

volumes:
  filestore:
  db:
